<style>
/* Layout: a contact sheet you vote on. A sticky bar holds the tally and the
   filter; every round is a grid of tiles with Approve / Not this / Note.
   Single dark look on purpose: the board sits in the brand's umber. */
:root {
  --bg: #120B09; --panel: #1B1210; --line: #33241E; --text: #ECE2D0; --muted: #A8937E;
  --amber: #C99863; --amber-ink: #1A0F0B; --no: #7D6A60;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--display); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 36px 18px; display: grid; gap: 10px; }
h1 { margin: 0; font-size: clamp(32px, 5.4vw, 64px); font-weight: 800; font-stretch: 125%; line-height: .92; letter-spacing: -.01em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); max-width: 62ch; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.tally { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tally b { color: var(--text); font-weight: 500; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--amber-ink); }
.spacer { flex: 1; }
.status { font: 400 12px var(--mono); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

main { padding-block: 26px 80px; display: grid; gap: 44px; }
section.group { display: grid; gap: 14px; }
section.group h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
section.group h2 small { font: 400 12px var(--mono); color: var(--muted); }
.grid { display: grid; gap: 22px 16px; align-items: start; }
.grid.tall { grid-template-columns: repeat(auto-fill, minmax(min(168px, 100%), 1fr)); }
.grid.card { grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); }
.grid.square { grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); }
.grid.cutout { grid-template-columns: repeat(auto-fill, minmax(min(140px, 100%), 1fr)); }
.grid.type { grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 28px 18px; }
.gnote { margin: 0; color: var(--muted); font-size: 13px; max-width: 72ch; }

/* Live type specimen: the same lines in every pairing, over the same photo. */
.spec { container-type: inline-size; position: relative; display: grid; align-content: space-between; gap: 6cqi; width: 100%; aspect-ratio: 16 / 10; padding: 6cqi 6.5cqi; border: 0; border-radius: 8px; overflow: hidden; text-align: left; color: #EFE5D2; cursor: zoom-in;
  background: linear-gradient(100deg, rgba(14, 8, 6, .9) 30%, rgba(14, 8, 6, .55) 100%), url(board/l2.jpg) center 30% / cover, #120B09; outline-offset: 3px; }
.spec .wm { font-family: var(--fd); font-variation-settings: var(--fdv, normal); font-weight: var(--fdw, 400); font-size: calc(var(--wm, 1) * 10.5cqi); line-height: .92; letter-spacing: -.01em; }
.spec .wm i { font-style: italic; }
.spec .sub { font-family: var(--ft); font-variation-settings: var(--ftv, normal); font-size: 2.9cqi; color: #CDBBA3; margin-top: 2.2cqi; }
.spec .hl { font-family: var(--fd); font-variation-settings: var(--fdv, normal); font-weight: var(--fdw, 400); font-size: calc(var(--wm, 1) * 5cqi); line-height: 1; }
.spec .bd { font-family: var(--ft); font-variation-settings: var(--ftv, normal); font-size: 3cqi; line-height: 1.4; max-width: 44ch; margin-top: 1.8cqi; color: #E4D8C4; }
.spec .mn { font-family: var(--fm); font-size: 2.7cqi; color: #C99863; margin-top: 2cqi; }
.spec.upper .wm, .spec.upper .hl { text-transform: uppercase; letter-spacing: .01em; }
.tile[data-s="approved"] .spec { outline: 2px solid var(--amber); }
.tile[data-s="rejected"] .spec { opacity: .3; filter: grayscale(.7); }
.spec .badge { left: auto; right: 10px; }
.tile[data-s="approved"] .spec .badge { display: block; }
.why { margin: 0; color: var(--muted); font-size: 13px; }
.fonts { font: 400 11.5px var(--mono); color: var(--muted); }
.lb-spec { width: min(1100px, 100%); }
.lb-spec .spec { cursor: default; }

.tile { margin: 0; display: grid; gap: 8px; min-width: 0; }
.thumb { position: relative; display: block; width: 100%; max-width: 100%; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: #000; cursor: zoom-in; outline-offset: 3px; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: opacity .2s, filter .2s; }
.cutout .thumb { background: #2A1D18; }
.cutout .thumb img { object-fit: contain; padding: 12%; }
.badge { position: absolute; left: 8px; top: 8px; background: var(--amber); color: var(--amber-ink); font: 500 11px var(--mono); padding: 2px 8px; border-radius: 999px; display: none; }
.tile[data-s="approved"] .thumb { outline: 2px solid var(--amber); }
.tile[data-s="approved"] .badge { display: block; }
.tile[data-s="rejected"] .thumb img { opacity: .28; filter: grayscale(.7); }
.cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 600; min-width: 0; }
.cap b { font: 500 12px var(--mono); background: var(--line); border-radius: 6px; padding: 1px 7px; flex: none; }
.cap span { overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.acts button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.acts button:hover { color: var(--text); border-color: var(--muted); }
.acts .ok[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.acts .no[aria-pressed="true"] { background: var(--no); border-color: var(--no); color: var(--text); }
.acts .nt.has { color: var(--text); border-color: var(--muted); }
.note { width: 100%; min-height: 64px; resize: vertical; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
body[data-filter="approved"] .tile:not([data-s="approved"]),
body[data-filter="rejected"] .tile:not([data-s="rejected"]),
body[data-filter="todo"] .tile[data-s="approved"],
body[data-filter="todo"] .tile[data-s="rejected"] { display: none; }
section.group.empty { display: none; }
.none { color: var(--muted); padding-block: 40px; display: none; }
main.all-empty .none { display: block; }

.lb { position: fixed; inset: 0; z-index: 20; background: rgba(10, 6, 5, .94); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb-top, .lb-bottom { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.lb-stage { min-height: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.lb-stage img { justify-self: center; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; min-height: 0; }
.lb-stage .frame { min-height: 0; height: 100%; display: grid; place-items: center; }
.lb-stage .frame img { max-height: calc(100dvh - 170px); }
.nav { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; }
.lb .cap { font-size: 16px; }
@media (max-width: 640px) { .lb-stage { grid-template-columns: 1fr; } .lb-stage .nav { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top wrap">

  var ALL = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (it) { it.group = g.title; ALL.push(it); }); });

  var state = {};          // id -> {status, note}

  // Render once; later changes only touch attributes.
  GROUPS.forEach(function (g) {
    var sec = document.createElement('section');
    sec.className = 'group';
    var h = document.createElement('h2');
    h.textContent = g.title;
    var small = document.createElement('small');

    h.appendChild(small);

  function line(cls, text) { var d = document.createElement('div'); d.className = cls; d.textContent = text; return d; }

  // A live specimen: same copy for every pairing so only the type changes.
  function specEl(it, tag) {
    var el = document.createElement(tag);

    el.className = 'spec' + (it.upper ? ' upper' : '');
    el.style.setProperty('--fd', it.d);
    el.style.setProperty('--fdw', String(it.dw || 400));
    el.style.setProperty('--wm', String(it.wm || 1));
    el.style.setProperty('--ft', it.t);
    el.style.setProperty('--fm', it.m);
    if (it.dv) el.style.setProperty('--fdv', it.dv);
    if (it.tv) el.style.setProperty('--ftv', it.tv);
    var top = document.createElement('div');
    var wm = document.createElement('div'); wm.className = 'wm';
    wm.appendChild(document.createTextNode('Harbor '));

    wm.appendChild(second);
    top.appendChild(wm);
    top.appendChild(line('sub', 'Film Festival · April 15 to 17, 2027'));
    var bottom = document.createElement('div');
    bottom.appendChild(line('hl', 'Lena is running late'));

  function tile(it) {

      b = specEl(it, 'button');
    } else {
      b = document.createElement('button');
      b.type = 'button'; b.className = 'thumb';
      b.style.aspectRatio = it.w + ' / ' + it.h;
      var img = document.createElement('img');

    var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = 'Approved';
    b.appendChild(badge);
    b.addEventListener('click', function () { openLb(it.id); });

    var code = document.createElement('b'); code.textContent = it.code;
    var name = document.createElement('span'); name.textContent = it.name;
    cap.appendChild(code); cap.appendChild(name);
    if (it.kind === 'type') {

      var why = document.createElement('p'); why.className = 'why'; why.textContent = it.why;
      var fonts = document.createElement('div'); fonts.className = 'fonts'; fonts.textContent = it.fonts;
      f.appendChild(why); f.appendChild(fonts);

    }

  }

  function finishTile(f, it) {

    ta.className = 'note'; ta.id = 'note-' + it.id; ta.hidden = true;
    ta.placeholder = 'What would make it right?';

    ta.addEventListener('input', function () {
      s(it.id).note = ta.value;
      paint(it.id);
      clearTimeout(noteTimers[it.id]);
      noteTimers[it.id] = setTimeout(function () { save(it.id); }, 700);
    });
    f.appendChild(acts); f.appendChild(ta);
    return f;
  }

  function actions(id, inLb) {
    var wrap = document.createElement('div'); wrap.className = 'acts';
    var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'ok'; ok.textContent = 'Approve';
    var no = document.createElement('button'); no.type = 'button'; no.className = 'no'; no.textContent = 'Not this';
    ok.addEventListener('click', function () { vote(id, 'approved'); });
    no.addEventListener('click', function () { vote(id, 'rejected'); });
    wrap.appendChild(ok); wrap.appendChild(no);
    if (!inLb) {
      var nt = document.createElement('button'); nt.type = 'button'; nt.className = 'nt'; nt.textContent = 'Note';
      nt.addEventListener('click', function () {
        var ta = document.getElementById('note-' + id);
        ta.hidden = !ta.hidden;
        if (!ta.hidden) ta.focus();
      });
      wrap.appendChild(nt);
    }
    return wrap;
  }

  function vote(id, v) {
    var cur = s(id);
    cur.status = cur.status === v ? '' : v;
    paint(id); tally();
    if (lbId === id) paintLb();
    save(id);
  }

  function paint(id) {
    var f = app.querySelector('.tile[data-id="' + id + '"]');
    if (!f) return;
    var cur = s(id);
    f.dataset.s = cur.status;
    f.querySelector('.ok').setAttribute('aria-pressed', String(cur.status === 'approved'));
    f.querySelector('.no').setAttribute('aria-pressed', String(cur.status === 'rejected'));
    f.querySelector('.nt').classList.toggle('has', !!cur.note);
    var ta = f.querySelector('textarea');
    if (document.activeElement !== ta) {
      ta.value = cur.note || '';
      if (cur.note) ta.hidden = false;
    }
  }

  function tally() {
    var a = 0, r = 0;
    ALL.forEach(function (it) { var st = s(it.id).status; if (st === 'approved') a++; else if (st === 'rejected') r++; });
    var el = document.getElementById('tally');
    el.textContent = '';
    [[a, ' approved'], [r, ' not this'], [ALL.length - a - r, ' to review']].forEach(function (p, i) {
      if (i) el.appendChild(document.createTextNode(' · '));
      var b = document.createElement('b'); b.textContent = p[0];
      el.appendChild(b); el.appendChild(document.createTextNode(p[1]));

    applyFilter();
  }

  // Filter
  var filter = 'all';
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.f;
      document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      applyFilter();
    });
  });
  function applyFilter() {
    document.body.dataset.filter = filter;
    var any = false;
    app.querySelectorAll('section.group').forEach(function (sec) {
      var visible = Array.prototype.some.call(sec.querySelectorAll('.tile'), function (t) {
        var st = t.dataset.s;
        return filter === 'all' || (filter === 'todo' ? !st : st === filter);
      });
      sec.classList.toggle('empty', !visible);
      if (visible) any = true;
    });
    app.classList.toggle('all-empty', !any);
  }

  // Saving: one write at a time per item, only after a change.
  function save(id) {
    var cur = s(id);
    var body = { status: cur.status, note: cur.note || '', code: BY_ID[id].code, name: BY_ID[id].name, at: new Date().toISOString() };
    if (local) {
      try { localStorage.setItem('picks:' + id, JSON.stringify(body)); } catch (e) {}
      return;
    }
    if (!db) return;
    setStatus('Saving');
    chains[id] = (chains[id] || Promise.resolve()).then(function () {
      return db.collection('picks').doc(id).set(body);
    }).then(function () { setStatus('Saved'); }, function (e) {
      setStatus(e && e.code === 'invalid_argument' ? 'This view can only read picks' : 'Not saved. Try again in a moment.');
    });
  }

  function useLocal() {
    local = true;
    setStatus('Saving in this browser only');
    ALL.forEach(function (it) {
      try {
        var raw = localStorage.getItem('picks:' + it.id);
        if (raw) { var d = JSON.parse(raw); state[it.id] = { status: d.status || '', note: d.note || '' }; }
      } catch (e) {}
      paint(it.id);
    });
    tally();
  }

  async function connect() {
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) { useLocal(); return; }
    var timer = setTimeout(function () { setStatus('Saved picks are not reachable yet'); }, 10000);
    db.collection('picks').onSnapshot(function (snap) {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (statusEl.textContent !== 'Saving') setStatus('Saved'); }
      snap.docs.forEach(function (d) {
        if (!BY_ID[d.id]) return;
        var data = d.data() || {};
        var cur = s(d.id);
        cur.status = data.status || '';
        var ta = document.getElementById('note-' + d.id);
        if (document.activeElement !== ta) cur.note = data.note || '';
        paint(d.id);
      });
      tally();
      if (lbId) paintLb();
    }, function () {
      clearTimeout(timer);
      setStatus('Picks cannot be saved right now');
    });
  }

  // Copy a plain list of picks.
  document.getElementById('copy').addEventListener('click', function () {
    var by = { approved: [], rejected: [] }, notes = [];
    ALL.forEach(function (it) {
      var cur = s(it.id);
      if (by[cur.status]) by[cur.status].push(it.code + ' ' + it.name);
      if (cur.note) notes.push(it.code + ' ' + it.name + ': ' + cur.note);
    });
    var text = 'Approved: ' + (by.approved.join('; ') || 'none') + '\nNot this: ' + (by.rejected.join('; ') || 'none') + (notes.length ? '\nNotes:\n' + notes.join('\n') : '');
    var btn = this;
    function done(t) { btn.textContent = t; setTimeout(function () { btn.textContent = 'Copy picks'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done('Copied'); }, function () { done('Copy blocked'); });
    } else { done('Copy blocked'); }
  });

  // Large view
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
  var lbActs = document.getElementById('lb-acts'), lbCap = document.getElementById('lb-cap');
  var lbId = null, lastFocus = null;
  function visibleIds() {
    return Array.prototype.filter.call(app.querySelectorAll('.tile'), function (t) { return t.offsetParent !== null; }).map(function (t) { return t.dataset.id; });
  }
  function openLb(id) {
    lastFocus = document.activeElement;
    lbId = id; lb.hidden = false; paintLb();
    document.getElementById('lb-close').focus();
  }
  function paintLb() {
    var it = BY_ID[lbId];
    var host = document.getElementById('lb-spec');
    if (it.kind === 'type') {
      lbImg.hidden = true; host.hidden = false;
      host.textContent = ''; host.appendChild(specEl(it, 'div'));
    } else {
      host.hidden = true; lbImg.hidden = false;
      lbImg.src = it.src; lbImg.alt = it.name;
    }
    lbCap.textContent = '';
    var b = document.createElement('b'); b.textContent = it.code;
    var n = document.createElement('span'); n.textContent = it.name + ' · ' + it.group;
    lbCap.appendChild(b); lbCap.appendChild(n);
    lbActs.textContent = '';
    var a = actions(lbId, true);
    var cur = s(lbId);
    a.querySelector('.ok').setAttribute('aria-pressed', String(cur.status === 'approved'));
    a.querySelector('.no').setAttribute('aria-pressed', String(cur.status === 'rejected'));
    while (a.firstChild) lbActs.appendChild(a.firstChild);
  }
  function step(d) {
    var ids = visibleIds(); if (!ids.length) return;
    var i = ids.indexOf(lbId);
    lbId = ids[(i + d + ids.length) % ids.length]; paintLb();
  }

  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('frame')) closeLb(); });

    if (lb.hidden || e.metaKey || e.ctrlKey || e.altKey) return;

    else if (e.key === 'ArrowLeft') step(-1);
