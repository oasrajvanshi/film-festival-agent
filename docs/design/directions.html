<title>Harbor Lights Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: round 4 contact sheet, in the palette sampled from the four
   references. Three rows (light, still life, black and white), each tile
   carries a code to reply with and the screen it could serve. */
:root {
  --umber: #110908; --umber-2: #1C1210; --line: #34221B; --cream: #E9DFCB; --muted: #A79581; --amber: #A17956;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--umber); color: var(--cream); font-family: var(--display); }
p { margin: 0; }
.band { padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1320px; margin: 0 auto; display: grid; gap: 26px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: clamp(30px, 4.6vw, 56px); font-weight: 800; font-stretch: 125%; line-height: .9; }
h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--cream); }
.mono { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches span { display: grid; gap: 6px; font: 400 11px var(--mono); color: var(--muted); }
.swatches i { width: 52px; height: 30px; border-radius: 6px; border: 1px solid #ffffff14; }
.toggle { display: inline-flex; align-items: center; gap: 10px; background: var(--umber-2); border: 1px solid var(--line); color: var(--cream); border-radius: 999px; padding: 8px 14px 8px 10px; font: 500 13px var(--mono); cursor: pointer; }
.toggle i { width: 30px; height: 18px; border-radius: 999px; background: #3b2a23; position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--cream); transition: transform .2s; }
.toggle[aria-pressed="true"] i { background: var(--amber); }
.toggle[aria-pressed="true"] i::after { transform: translateX(12px); }
.toggle:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.group { display: grid; gap: 14px; }
.row { display: grid; gap: 18px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
figure { margin: 0; display: grid; gap: 10px; min-width: 0; }
.img { position: relative; overflow: hidden; border-radius: 8px; background: #000 center / cover; aspect-ratio: 9 / 16; }
.img::after { content: ""; position: absolute; inset: 0; background: var(--grain); mix-blend-mode: overlay; opacity: 0; transition: opacity .25s; pointer-events: none; }
body.grain .img::after { opacity: .35; }
figcaption { display: grid; gap: 3px; font-size: 14px; font-weight: 600; }
figcaption span { display: flex; gap: 8px; align-items: baseline; }
figcaption b { font-family: var(--mono); font-weight: 500; background: var(--line); color: var(--cream); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
figcaption small { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
@media (max-width: 960px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<section class="band">
  <div class="in">
    <header>
      <div style="display:grid;gap:10px">
        <h1>ROUND 4</h1>
        <p class="mono">Umber, amber, one light · from your four references · reply with codes</p>
      </div>
      <button class="toggle" id="grain" type="button" aria-pressed="true" data-lve-allow><i></i>Poster grain</button>
    </header>

    <div class="swatches" aria-label="Palette sampled from the references">
      <span><i style="background:#110908"></i>#110908</span>
      <span><i style="background:#34221B"></i>#34221B</span>
      <span><i style="background:#713E28"></i>#713E28</span>
      <span><i style="background:#A17956"></i>#A17956</span>
      <span><i style="background:#D0BD99"></i>#D0BD99</span>
      <span><i style="background:#564340"></i>#564340</span>
      <span><i style="background:#968A80"></i>#968A80</span>
    </div>

    <div class="group">
      <h2>Light</h2>
      <div class="row">
        <figure><div class="img" style="background-image:url(round4/l1-stairs.jpg)"></div><figcaption><span><b>L1</b>Stairs</span><small>onboarding</small></figcaption></figure>
        <figure><div class="img" style="background-image:url(round4/l2-projector.jpg)"></div><figcaption><span><b>L2</b>Projector beam</span><small>onboarding, splash</small></figcaption></figure>
        <figure><div class="img" style="background-image:url(round4/l3-doorway.jpg)"></div><figcaption><span><b>L3</b>Open door</span><small>staff</small></figcaption></figure>
      </div>
    </div>

    <div class="group">
      <h2>Still life</h2>
      <div class="row">
        <figure><div class="img" style="background-image:url(round4/s2-chair.jpg)"></div><figcaption><span><b>S1</b>Director's chair</span><small>festival team</small></figcaption></figure>
        <figure><div class="img" style="background-image:url(round4/s3-tickets.jpg)"></div><figcaption><span><b>S2</b>Tickets</span><small>attendee</small></figcaption></figure>
        <figure><div class="img" style="background-image:url(round4/s1-reels.jpg)"></div><figcaption><span><b>S3</b>Film reels</span><small>empty states</small></figcaption></figure>
      </div>
    </div>

    <div class="group">
      <h2>Black and white</h2>
      <div class="row">
        <figure><div class="img" style="background-image:url(round4/m1-chairs.jpg)"></div><figcaption><span><b>M1</b>Empty hall</span><small>staff setup</small></figcaption></figure>
        <figure><div class="img" style="background-image:url(round4/m2-audience.jpg)"></div><figcaption><span><b>M2</b>Audience</span><small>attendee agenda</small></figcaption></figure>
      </div>
    </div>
  </div>
</section>
<script>
(function () {
  var b = document.getElementById('grain');
  document.body.classList.add('grain');
  b.addEventListener('click', function () {
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('grain', on);
  });
})();
</script>
<script src="live-editor.js" defer></script>
